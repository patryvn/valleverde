name: Manual Valle de Cernego APK build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore persistent preview signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: cernego-preview-signing-v1

      - name: Initialize preview signing key if absent
        run: |
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Save persistent preview signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: cernego-preview-signing-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Build release-test APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-APK-manual
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
