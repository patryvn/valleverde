name: Build and test Valle de Cernego APKs

on:
  workflow_dispatch:
  push:
    branches: [game/first-3d-playable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build installable release-test APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signatures and package version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='es.valledecernego.game' versionCode='16' versionName='0.16.0'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Smoke-test the 3D scene on an Android emulator
        id: emulator-smoke
        env:
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 4
          disable-animations: true
          script: |
            set -eu
            mkdir -p emulator-output
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && [ "$(adb shell getprop init.svc.bootanim | tr -d '\r')" = "stopped" ]; do sleep 2; done
            # sys.boot_completed alone is not enough on a very slow TCG emulator:
            # system_server may still be restarting and PackageManager may be absent.
            package_ready=0
            for attempt in $(seq 1 90); do
              if adb shell cmd package list packages 2>/dev/null | grep -q '^package:'; then
                package_ready=1
                break
              fi
              sleep 2
            done
            if [ "$package_ready" -ne 1 ]; then
              adb shell getprop > emulator-output/getprop-before-install.txt || true
              adb logcat -b all -d -v time > emulator-output/logcat-before-install.txt || true
              echo "PackageManager did not become ready after Android boot."
              exit 1
            fi
            adb logcat -c
            install_ok=0
            for attempt in $(seq 1 5); do
              if adb install -r app/build/outputs/apk/debug/app-debug.apk; then
                install_ok=1
                break
              fi
              sleep 10
            done
            if [ "$install_ok" -ne 1 ]; then
              adb shell getprop > emulator-output/getprop-install-failure.txt || true
              adb logcat -b all -d -v time > emulator-output/logcat-install-failure.txt || true
              echo "APK installation failed after five attempts."
              exit 1
            fi
            adb shell input keyevent 224 || true
            adb shell input keyevent 82 || true
            adb shell am force-stop es.valledecernego.game
            adb shell am start -W -n es.valledecernego.game/.MainActivity
            app_ready=0
            for attempt in $(seq 1 90); do
              app_pid="$(adb shell pidof es.valledecernego.game | tr -d '\r' || true)"
              resumed="$(adb shell dumpsys activity activities 2>/dev/null | grep -E 'mResumedActivity|topResumedActivity' || true)"
              focus="$(adb shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' || true)"
              if [ -n "$app_pid" ] && printf '%s\n%s\n' "$resumed" "$focus" | grep -Fq 'es.valledecernego.game'; then
                app_ready=1
                break
              fi
              sleep 2
            done
            test "$app_ready" -eq 1
            sleep 10
            adb shell dumpsys activity activities > emulator-output/activities.txt
            adb shell dumpsys window windows > emulator-output/windows.txt
            adb exec-out screencap -p > emulator-output/valle-cernego-initial.png
            test -s emulator-output/valle-cernego-initial.png
            adb shell uiautomator dump /data/local/tmp/window.xml
            adb pull /data/local/tmp/window.xml emulator-output/window.xml
            grep -F "VALLE DE CERNEGO" emulator-output/window.xml
            grep -F "60 piezas enviadas" emulator-output/window.xml
            screen_size="$(adb shell wm size | sed -n 's/.*: //p')"
            screen_w="${screen_size%x*}"
            screen_h="${screen_size#*x}"
            unit=$((screen_h < screen_w*55/100 ? screen_h : screen_w*55/100))
            joy_x=$((unit*20/100))
            joy_y=$((screen_h-unit*22/100))
            move_x=$((joy_x+unit*10/100))
            # Android 15/35 input requires an explicit display ID after the duration.
            adb shell input swipe "$joy_x" "$joy_y" "$move_x" "$joy_y" 900 0
            sleep 3
            adb exec-out screencap -p > emulator-output/valle-cernego-moving.png
            test -s emulator-output/valle-cernego-moving.png
            adb shell pidof es.valledecernego.game
            adb logcat -d -v time > emulator-output/logcat.txt
            if grep -E "FATAL EXCEPTION.*Process: es.valledecernego.game|DeadSystemException|ValleCernego.*OpenGL 0x" emulator-output/logcat.txt; then
              exit 1
            fi

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-emulator-smoke
          path: emulator-output/
          if-no-files-found: ignore

