name: Build and test Valle de Cernego APKs

on:
  workflow_dispatch:
  push:
    branches: [game/first-3d-playable]

permissions:
  contents: read
  statuses: write

concurrency:
  # Serialize automatic and manual builds so the first cached signing key
  # cannot be generated concurrently by two runners.
  group: valle-cernego-preview-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Validate Android smoke scripts
        run: |
          bash -n scripts/emulator-smoke.sh
          python3 -m py_compile scripts/verify-player-screenshot.py scripts/verify-player-motion.py scripts/test_player_motion.py scripts/test_emulator_smoke.py scripts/verify-window-state.py scripts/test_window_state.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore persistent preview signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: cernego-preview-signing-v1

      - name: Initialize preview signing key if absent
        run: |
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Save persistent preview signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: cernego-preview-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build installable release-test APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signatures and package version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          release_metadata="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk)"
  printf '%s\n' "$release_metadata" | grep -F "package: name='es.valledecernego.game.preview2' versionCode='59' versionName='0.29.8'"
  printf '%s\n' "$release_metadata" | grep -F "application-label:'Valle de Cernego PREVIEW2 v0.29.8'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Grant the runner access to KVM
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::warning::/dev/kvm is unavailable; the Android emulator will use software acceleration."
            exit 0
          fi
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner still cannot read and write /dev/kvm."
            exit 1
          fi
          echo "KVM is accessible to $(id -un)."
          ls -l /dev/kvm

      - name: Smoke-test the 3D scene on an Android emulator
        id: emulator-smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          disable-animations: true
          script: bash scripts/emulator-smoke.sh

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-emulator-smoke
          path: emulator-output/
          if-no-files-found: ignore

      - name: Publish compact CI status for follow-up checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          case "$JOB_RESULT" in
            success) status="success" ;;
            failure|cancelled) status="failure" ;;
            *) status="error" ;;
          esac
          curl --silent --show-error --fail-with-body -X POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"state\":\"$status\",\"context\":\"valle-cernego/ci\",\"description\":\"Unit tests, debug/release builds and Android emulator smoke\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "::warning::Could not publish compact CI status."
