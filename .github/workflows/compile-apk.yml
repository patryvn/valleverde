name: Build and test Valle de Cernego APKs

on:
  workflow_dispatch:
  push:
    branches: [game/first-3d-playable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build installable release-test APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signatures and package version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='es.valledecernego.game' versionCode='15' versionName='0.15.0'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Smoke-test the 3D scene on an Android emulator
        id: emulator-smoke
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p emulator-output
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop es.valledecernego.game
            adb shell am start -n es.valledecernego.game/.MainActivity
            sleep 10
            adb logcat -d -s ValleCernego:I AndroidRuntime:E > emulator-output/logcat.txt
            adb exec-out screencap -p > emulator-output/valle-cernego-initial.png
            test -s emulator-output/valle-cernego-initial.png
            screen_size=$(adb shell wm size | sed -n 's/.*: //p')
            screen_w=${screen_size%x*}
            screen_h=${screen_size#*x}
            unit=$((screen_h < screen_w*55/100 ? screen_h : screen_w*55/100))
            joy_x=$((unit*20/100))
            joy_y=$((screen_h-unit*22/100))
            move_x=$((joy_x+unit*10/100))
            adb shell input swipe "$joy_x" "$joy_y" "$move_x" "$joy_y" 1200
            sleep 2
            adb exec-out screencap -p > emulator-output/valle-cernego-moving.png
            test -s emulator-output/valle-cernego-moving.png
            adb shell uiautomator dump /data/local/tmp/window.xml
            adb pull /data/local/tmp/window.xml emulator-output/window.xml
            if grep -Fq "60 piezas enviadas" emulator-output/window.xml; then
              echo "60 player pieces submitted; inspect screenshots for pixel visibility" > emulator-output/render-status.txt
            else
              echo "Player draw calls not confirmed in UI hierarchy" > emulator-output/render-status.txt
              exit 1
            fi
            test -s emulator-output/valle-cernego-initial.png
            test -s emulator-output/valle-cernego-moving.png
            if grep -E "FATAL EXCEPTION|OpenGL 0x" emulator-output/logcat.txt; then
              exit 1
            fi

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-emulator-smoke
          path: emulator-output/
          if-no-files-found: ignore

