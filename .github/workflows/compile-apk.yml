name: Build and test Valle de Cernego APKs

on:
  workflow_dispatch:
  push:
    branches: [game/first-3d-playable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Validate Android smoke scripts
        run: |
          bash -n scripts/emulator-smoke.sh
          python3 -m py_compile scripts/verify-player-screenshot.py scripts/verify-player-motion.py scripts/test_player_motion.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build installable release-test APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signatures and package version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='es.valledecernego.game' versionCode='24' versionName='0.23.0'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Smoke-test the 3D scene on an Android emulator
        id: emulator-smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: bash scripts/emulator-smoke.sh

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-emulator-smoke
          path: emulator-output/
          if-no-files-found: ignore
