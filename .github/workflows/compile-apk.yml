name: Build and test Valle de Cernego APKs

on:
  workflow_dispatch:
  push:
    branches: [game/first-3d-playable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build installable release-test APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signatures and package version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='es.valledecernego.game' versionCode='15' versionName='0.15.0'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Smoke-test the 3D scene on an Android emulator
        id: emulator-smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: |
            set -eu
            mkdir -p emulator-output
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop es.valledecernego.game
            adb shell am start -W -n es.valledecernego.game/.MainActivity
            for attempt in $(seq 1 30); do
              app_pid=$(adb shell pidof es.valledecernego.game | tr -d '\r')
              if [ -n "$app_pid" ]; then break; fi
              sleep 2
            done
            test -n "$app_pid"
            sleep 8
            adb shell dumpsys activity activities > emulator-output/activities.txt
            grep -F "es.valledecernego.game/.MainActivity" emulator-output/activities.txt
            adb shell uiautomator dump /data/local/tmp/window.xml
            adb pull /data/local/tmp/window.xml emulator-output/window.xml
            grep -F "VALLE DE CERNEGO" emulator-output/window.xml
            grep -F "60 piezas enviadas" emulator-output/window.xml
            adb exec-out screencap -p > emulator-output/valle-cernego-initial.png
            test -s emulator-output/valle-cernego-initial.png
            # Pixel 2 AVD is landscape at 1920x1080; these coordinates match Hud's joystick centre.
            adb shell input swipe 211 848 316 848 900
            sleep 2
            adb exec-out screencap -p > emulator-output/valle-cernego-moving.png
            test -s emulator-output/valle-cernego-moving.png
            adb shell pidof es.valledecernego.game
            adb logcat -d -v time > emulator-output/logcat.txt
            if grep -E "FATAL EXCEPTION.*Process: es.valledecernego.game|ValleCernego.*OpenGL 0x" emulator-output/logcat.txt; then
              exit 1
            fi

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValleDeCernego-emulator-smoke
          path: emulator-output/
          if-no-files-found: ignore

