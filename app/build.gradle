plugins { id 'com.android.application' }
android {
    namespace 'es.valledecernego.game'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'es.valledecernego.game'
        minSdk 23
        targetSdk 35
        versionCode 54
        versionName '0.29.3'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        release {
            // Separate preview package lets testers keep the existing save-bearing app installed.
            applicationIdSuffix ".preview"
            // Signed with the CI debug key so the release-test APK is directly installable.
            // This is not a Play Store signing key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
