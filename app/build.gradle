plugins { id 'com.android.application' }
android {
    namespace 'es.valledecernego.game'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'es.valledecernego.game'
        minSdk 23
        targetSdk 35
        versionCode 32
        versionName '0.27.1'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        release {
            // Signed with the CI debug key so the release-test APK is directly installable.
            // This is not a Play Store signing key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
